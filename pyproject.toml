[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mithleshjha2006", email = "mithleshkujha2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.145.0",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
